name: worker_ui
description: "Corterm Worker 本机控制面板 — 用 UI 替代 corterm/cortap 命令行。"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 用户可设置的二进制路径 / 主题 / 语言
  shared_preferences: ^2.5.0
  # 登录设备码二维码（纯 Dart，无原生依赖）
  qr_flutter: ^4.1.0
  # 拼接 home 目录与二进制名
  path: ^1.9.0
  # 系统托盘（macOS 菜单栏 / Win / Linux）+ 右键菜单
  tray_manager: ^0.2.3
  # 窗口管理：关闭隐藏到托盘、显示/聚焦
  window_manager: ^0.4.3
  # 开机启动
  launch_at_startup: ^0.5.0
  # UI 框架：shadcn/ui（ShadApp + ShadTheme，Material 仅保留 Scaffold 结构件；
  # LucideIcons 由 shadcn_ui 再导出，无需单独依赖）
  shadcn_ui: ^0.56.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # 托盘菜单栏图标（macOS template）
  assets:
    - assets/tray_icon.png
    # 内置 worker 二进制（一体：装 App 即带 worker，首跑自动装到 ~/.corterm）。
    # 必须声明目录而不是逐个文件：Windows 构建时 CI 放进来的是 corterm.exe/
    # cortap.exe，逐文件声明会漏掉 .exe（ui-v0.1.0 的 Windows 包因此没带 worker，
    # App 只能撞 PATH 上的旧版 corterm 报「stdout 不是合法 JSON」）。
    - assets/bin/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# jni 从 path_provider_android 2.3.x 混入 Linux/Windows 原生构建（FFI 插件表），
# 桌面端用不到 Android JNI，override 到 2.2.x 避免给 Windows CI 加 JVM 构建依赖。
dependency_overrides:
  path_provider_android: 2.2.23
