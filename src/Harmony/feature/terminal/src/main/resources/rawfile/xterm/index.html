<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CortexTerminal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #terminal-container {
      width: 100%;
      height: 100%;
      background-color: #121414;
      overflow: hidden;
    }
    /* Prevent text selection on long press */
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    /* Allow text selection inside terminal */
    .xterm {
      user-select: text;
      -webkit-user-select: text;
    }

  </style>
  <link rel="stylesheet" href="xterm.css" />
</head>
<body>
  <div id="terminal-container"></div>

  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>
  <script src="xterm-addon-webgl.js"></script>
  <script src="xterm-addon-serialize.js"></script>

  <script>
    // === Globals ===
    let term = null;
    let fitAddon = null;
    let serializeAddon = null;
    let terminalContainer = null;

    // === WebMessagePort 通信 ===
    var h5Port;
    function sendToHost(msg) {
      if (h5Port) {
        h5Port.postMessage(JSON.stringify(msg));
      }
    }
    window.addEventListener('message', function(event) {
      if (event.data === '__init_port__') {
        if (event.ports[0]) {
          h5Port = event.ports[0];
          console.log('h5Port initialized');
        }
      }
    });

    // === Bridge functions (called from ArkTS via runJavaScript) ===

    /**
     * Initialize xterm.js terminal instance.
     * @param {number} cols - Initial columns (default 80)
     * @param {number} rows - Initial rows (default 24)
     */
    function initTerminal(cols, rows, useWebGL) {
      if (term) {
        term.dispose();
      }

      cols = cols || 80;
      rows = rows || 24;

      term = new Terminal({
        cols: cols,
        rows: rows,
        cursorBlink: true,
        cursorStyle: 'bar',
        fontSize: 14,
        fontFamily: 'monospace',
        theme: {
          background: '#121414',
          foreground: '#e3e2e2',
          cursor: '#9fcaff',
          cursorAccent: '#121414',
          selectionBackground: '#3a95e8',
          black: '#3a3d3d',
          red: '#ffb4ab',
          green: '#a2d489',
          yellow: '#ffd180',
          blue: '#9fcaff',
          magenta: '#f5a8d0',
          cyan: '#80cbc4',
          white: '#e3e2e2',
          brightBlack: '#8e9192',
          brightRed: '#ffb4ab',
          brightGreen: '#a2d489',
          brightYellow: '#ffd180',
          brightBlue: '#9fcaff',
          brightMagenta: '#f5a8d0',
          brightCyan: '#80cbc4',
          brightWhite: '#e3e2e2'
        },
        scrollback: 64000,
        allowProposedApi: true,
        allowTransparency: false
      });

      fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);

      serializeAddon = new SerializeAddon.SerializeAddon();
      term.loadAddon(serializeAddon);

      const container = document.getElementById('terminal-container');
      terminalContainer = container;
      term.open(container);

      // Register resize handler BEFORE fit() so the initial resize event is captured.
      // Debounced 150ms (MAUI parity: RESIZE_DEBOUNCE_MS): keyboard animation produces
      // many intermediate sizes; sending each one SIGWINCHes the server, making
      // full-screen apps redraw per intermediate size (the residual "刷屏").
      var resizeSyncTimer = null;
      var pendingSize = null;
      term.onResize(function(size) {
        pendingSize = size;
        if (resizeSyncTimer) clearTimeout(resizeSyncTimer);
        resizeSyncTimer = setTimeout(function() {
          resizeSyncTimer = null;
          if (h5Port && pendingSize) {
            h5Port.postMessage(JSON.stringify({ type: 'resize', cols: pendingSize.cols, rows: pendingSize.rows }));
            pendingSize = null;
          }
        }, 150);
      });

      // Fit immediately to ensure correct size before any output arrives
      try {
        fitAddon.fit();
      } catch(e) {
        console.warn('fitAddon.fit() failed:', e);
      }

      // Forward user input to ArkTS via WebMessagePort (MUST register before WebGL,
      // so a renderer init failure can never break input — VS Code applies the same pattern)
      term.onData(function(data) {
        if (h5Port) {
          h5Port.postMessage(JSON.stringify({ type: 'input', data: data }));
        } else {
          console.error('h5Port is NULL, input dropped: ' + JSON.stringify(data));
          document.title = 'h5Port NULL!';
        }
      });

      // Session title: xterm parses OSC 0/2 emitted by the remote shell (the
      // Worker injects title-reporting into the managed zshrc/bashrc/prompt) and
      // fires this callback. Forward to ArkTS so the page title / session list
      // can track the live title — Windows-Terminal-style passive listening, the
      // sequence is consumed by the parser and never rendered.
      term.onTitleChange(function(title) {
        if (title && h5Port) {
          h5Port.postMessage(JSON.stringify({ type: 'title', title: title }));
        }
      });

      // === OSC 扩展（对齐 Flutter 端 onPrivateOSC）===
      // 52 远程剪贴板 / 9,777 远程通知 / 7 当前目录。
      // xterm 解析到对应序列即抛给 ArkTS（粘贴板写入 / Toast / AppStorage）；
      // 返回 true 表示序列已消费，不作为屏幕内容渲染。
      term.parser.registerOscHandler(52, function(data) {
        // data = "c;<base64>"（目标选择器可省略，只取 base64 载荷）
        var payload = data;
        var idx = data.indexOf(';');
        if (idx >= 0) payload = data.substring(idx + 1);
        sendToHost({ type: 'osc', code: '52', data: payload });
        return true;
      });
      term.parser.registerOscHandler(9, function(data) {
        sendToHost({ type: 'osc', code: '9', data: data });
        return true;
      });
      term.parser.registerOscHandler(777, function(data) {
        sendToHost({ type: 'osc', code: '777', data: data });
        return true;
      });
      term.parser.registerOscHandler(7, function(data) {
        sendToHost({ type: 'osc', code: '7', data: data });
        return true;
      });

      // === Renderer: WebGL (user-controlled via settings) ===
      // ArkWeb API20+ emulators have a GPU regression where WebGL canvas
      // renders pure black. Users can disable GPU acceleration in Settings
      // to fall back to the DOM renderer (slightly slower but works everywhere).

      if (useWebGL !== false) {
        try {
          // Monkey-patch mainDocument — required for WebGL context on ArkWeb.
          var core = term._core;
          if (core && core._coreBrowserService) {
            core._coreBrowserService.mainDocument = document;
          }
          var webglAddon = new WebglAddon.WebglAddon();
          term.loadAddon(webglAddon);
          webglAddon.onContextLoss(function() {
            console.error('[XtermWebview] WebGL context lost');
          });
          console.info('[XtermWebview] WebGL renderer enabled');
        } catch(e) {
          console.warn('[XtermWebview] WebGL failed: ' + e.message + ' — using DOM');
        }
      } else {
        console.info('[XtermWebview] DOM renderer active (GPU acceleration disabled)');
      }

      // === Custom gesture layer (ported from MAUI useTouchScroll.ts) ===
      // xterm 6.0 WebGL doesn't support touch scroll natively — SmoothScrollableElement
      // only listens for wheel events, and the page is overflow:hidden so the browser
      // doesn't synthesize wheel from touch. MAUI solved this in useTouchScroll.ts;
      // this is a 1:1 native-JS port, extended with mouse reporting.
      //
      // Two modes, decided once per gesture from what the foreground app asked for:
      //   mouse mode — the app enabled mouse tracking (Claude Code fullscreen renders
      //                in the alternate screen and requests SGR 1006). Our drags become
      //                wheel reports and a tap becomes a left click, so its clickable
      //                collapsed tool rows expand. Claude Code scrolls and hit-tests
      //                from those reports; the alternate buffer has no scrollback, so
      //                scrolling locally would be a no-op anyway.
      //   local mode — no app wants mouse input (plain shell, Claude Code classic
      //                renderer): scroll our own scrollback and nudge the shell cursor
      //                toward the tapped column.
      // Both modes keep the 500ms long press, which selects text in the page so the
      // host can copy it to the PHONE clipboard (the app's own in-app selection would
      // copy on the worker machine instead).
      //
      // The listeners are non-passive and cancel the gesture: ArkWeb otherwise
      // synthesizes mousedown/mouseup/click from the tap, and xterm's own mouse
      // service would report the same finger a second time (or start a stray
      // selection) on top of what we send.
      (function setupGestures() {
        var PIXELS_PER_LINE = 17;         // local mode: one scrollback line per 17px
        var PIXELS_PER_WHEEL_NOTCH = 48;  // mouse mode: one wheel report per 48px
        var MAX_WHEEL_NOTCHES_PER_MOVE = 6;
        var FRICTION = 0.95;
        var MIN_VELOCITY = 0.5;
        var LONG_PRESS_MS = 500;
        var MOVE_THRESHOLD = 10;
        var MOUSE_BUTTON_LEFT = 0;
        var MOUSE_WHEEL_UP = 64;
        var MOUSE_WHEEL_DOWN = 65;

        // { mouseMode, wheelAccum, cursorCell, accumulated, lastY, lastTime, rafId,
        //   velocity, startX, startY, startMs, totalDelta, anchor, longPressTimer, selecting }
        var st = null;

        function clearLongPress(s) {
          if (s.longPressTimer) {
            clearTimeout(s.longPressTimer);
            s.longPressTimer = null;
          }
        }

        function focusTerminalTextarea() {
          var textarea = container.querySelector('.xterm-helper-textarea');
          if (textarea) textarea.focus();
        }

        /** Turn a drag delta into terminal motion: wheel reports when a foreground
         *  app owns the mouse, local scrollback otherwise. */
        function applyScrollDelta(s, delta) {
          if (s.mouseMode) {
            if (!s.cursorCell) return;
            s.wheelAccum += delta;
            var notches = Math.trunc(s.wheelAccum / PIXELS_PER_WHEEL_NOTCH);
            if (notches === 0) return;
            s.wheelAccum -= notches * PIXELS_PER_WHEEL_NOTCH;
            var button = notches > 0 ? MOUSE_WHEEL_DOWN : MOUSE_WHEEL_UP;
            var count = Math.min(Math.abs(notches), MAX_WHEEL_NOTCHES_PER_MOVE);
            for (var i = 0; i < count; i++) {
              sendMouseReport(button, s.cursorCell.col, s.cursorCell.row, true);
            }
            return;
          }
          s.accumulated += delta;
          var lines = Math.trunc(s.accumulated / PIXELS_PER_LINE);
          if (lines !== 0) {
            term.scrollLines(lines);
            s.accumulated -= lines * PIXELS_PER_LINE;
          }
        }

        container.addEventListener('touchstart', function(e) {
          if (e.touches.length !== 1) return;
          // Take the gesture over from the browser: no synthetic mouse events, no
          // native page gestures. Everything below is what the terminal receives.
          e.preventDefault();
          // Any new touch dismisses the host context menu.
          sendToHost({ type: 'contextmenuhide' });
          if (st && st.rafId) cancelAnimationFrame(st.rafId);

          var s = {
            mouseMode: mouseReportingActive(),
            wheelAccum: 0,
            cursorCell: null,
            accumulated: 0,
            lastY: e.touches[0].clientY,
            lastTime: Date.now(),
            rafId: 0,
            velocity: 0,
            startY: e.touches[0].clientY,
            startX: e.touches[0].clientX,
            startMs: Date.now(),
            totalDelta: 0,
            anchor: null,
            longPressTimer: null,
            selecting: false
          };

          // Long-press timer: after 500ms of no movement, switch to selection mode
          // and select the word under the finger through xterm's select() API (the
          // synthetic-touch approach never fired reliably on ArkWeb). The anchor is
          // the word's first cell, so dragging extends from there.
          s.longPressTimer = setTimeout(function() {
            s.selecting = true;
            var cell = cellAtClamped(s.startX, s.startY);
            focusTerminalTextarea();
            if (cell) {
              var wr = wordRangeAt(cell.col, cell.row);
              if (wr) {
                s.anchor = { col: wr.col, row: wr.row };
                term.select(wr.col, wr.row + term.buffer.active.viewportY, wr.length);
              }
            }
          }, LONG_PRESS_MS);

          st = s;
        }, { passive: false });

        container.addEventListener('touchmove', function(e) {
          if (!st || e.touches.length !== 1) return;
          var s = st;
          var touch = e.touches[0];

          s.totalDelta = Math.max(
            Math.abs(touch.clientY - s.startY),
            Math.abs(touch.clientX - s.startX));

          // Movement beyond threshold before long-press fires → cancel selection intent
          if (!s.selecting && s.totalDelta > MOVE_THRESHOLD) {
            clearLongPress(s);
          }

          e.preventDefault();

          // Selection mode: drive the exact cell range ourselves (xterm's touch
          // selection is unreliable on ArkWeb). cellAtClamped keeps a drag that
          // leaves the screen on the nearest edge cell, so the highlight stops at
          // the visible area instead of running past it.
          if (s.selecting) {
            selectCellRange(s.anchor, cellAtClamped(touch.clientX, touch.clientY));
            return;
          }

          var deltaY = s.lastY - touch.clientY;
          var now = Date.now();
          var dt = now - s.lastTime;
          if (dt > 0) s.velocity = deltaY / dt;

          s.lastY = touch.clientY;
          s.lastTime = now;
          s.cursorCell = cellAtClamped(touch.clientX, touch.clientY);
          applyScrollDelta(s, deltaY);
        }, { passive: false });

        container.addEventListener('touchend', function(e) {
          if (!st) return;
          var s = st;
          clearLongPress(s);

          if (s.selecting) {
            st = null;
            // Selection finalized — ask the host for the context menu
            // (复制/全选/粘贴/取消) at the lift point.
            var lift = e.changedTouches[0];
            sendToHost({ type: 'contextmenu', x: lift ? lift.clientX : s.startX, y: lift ? lift.clientY : s.startY });
            return;
          }

          // Mouse mode: a tap is a left click for the foreground app, which is what
          // expands a collapsed tool row or drops the input cursor at that cell.
          if (s.mouseMode && s.totalDelta <= MOVE_THRESHOLD) {
            st = null;
            var tapCell = cellAtClamped(s.startX, s.startY);
            focusTerminalTextarea();
            if (tapCell) {
              sendMouseReport(MOUSE_BUTTON_LEFT, tapCell.col, tapCell.row, true);
              sendMouseReport(MOUSE_BUTTON_LEFT, tapCell.col, tapCell.row, false);
            }
            return;
          }

          if (Math.abs(s.velocity) > MIN_VELOCITY) {
            var inertiaScroll = function() {
              if (!st) return;
              var cur = st;
              cur.velocity *= FRICTION;
              if (Math.abs(cur.velocity) < MIN_VELOCITY * 0.1) {
                st = null;
                return;
              }
              applyScrollDelta(cur, cur.velocity * 16);
              cur.rafId = requestAnimationFrame(inertiaScroll);
            };
            s.rafId = requestAnimationFrame(inertiaScroll);
            return;
          }

          st = null;
          if (s.mouseMode) {
            return;
          }
          // Short tap in local mode: refocus the terminal and nudge the shell cursor
          // toward the tapped column (same viewport row only — cross-row arrow
          // sequences are ambiguous in raw-mode shells).
          var tap = e.changedTouches[0];
          if (tap && s.totalDelta <= MOVE_THRESHOLD) {
            focusTerminalTextarea();
            handleTapToMove(tap.clientX, tap.clientY);
          }
        }, { passive: false });

        console.info('[XtermWebview] gesture layer installed (touch scroll + mouse reports)');
      })();

      console.log('Terminal initialized: ' + cols + 'x' + rows);
    }

    /**
     * Write raw string data to the terminal.
     * @param {string} data - Terminal escape sequence data
     */
    function writeOutput(data) {
      if (term) {
        term.write(data);
      }
    }

    /**
     * Decode base64 to bytes and write to terminal.
     * Shared by single-frame and batched write paths.
     * Normalizes bare \n to \r\n to prevent the staircase effect.
     */
    function decodeAndWrite(b64) {
      var binaryStr = atob(b64);
      var bytes = new Uint8Array(binaryStr.length);
      for (var i = 0; i < binaryStr.length; i++) {
        bytes[i] = binaryStr.charCodeAt(i) & 0xFF;
      }
      var text = new TextDecoder().decode(bytes);
      if (text.indexOf('\n') !== -1) {
        text = text.replace(/(?<!\r)\n/g, '\r\n');
        bytes = new TextEncoder().encode(text);
      }
      term.write(bytes);
    }

    /**
     * Write a single base64-encoded frame to the terminal.
     * @param {string} base64Data - Base64 encoded output data
     */
    function writeBase64Output(base64Data) {
      if (term && base64Data) {
        decodeAndWrite(base64Data);
      }
    }

    /**
     * Write multiple base64-encoded frames in one JS bridge call.
     * Frames are joined with '|' (base64 charset A-Za-z0-9+/= does not include '|').
     * @param {string} packed - '|' separated base64 frames
     */
    function writeBatchedOutput(packed) {
      if (!term || !packed) return;
      var frames = packed.split('|');
      for (var i = 0; i < frames.length; i++) {
        decodeAndWrite(frames[i]);
      }
    }

    /**
     * Resize the terminal to new dimensions.
     * @param {number} cols
     * @param {number} rows
     */
    function resizeTerminal(cols, rows) {
      if (term) {
        term.resize(cols, rows);
      }
    }

    /**
     * Fit the terminal to its container.
     */
    function fitTerminal() {
      if (fitAddon) {
        try {
          fitAddon.fit();
        } catch(e) {
          console.warn('fitAddon.fit() failed:', e);
        }
      }
    }

    /**
     * Clear the terminal screen.
     */
    function clearTerminal() {
      if (term) {
        term.clear();
      }
    }

    /**
     * Reset the terminal completely.
     */
    function resetTerminal() {
      if (term) {
        term.reset();
      }
    }

    /**
     * Get current terminal selection.
     * Two selection sources exist: xterm's own model (pointer drag) and the
     * native DOM text selection ArkWeb creates on long-press (only .xterm is
     * user-select:text). The host menu must be able to copy either.
     * Tapping the host menu dismisses the native selection before Copy's
     * runJavaScript lands, so captureSelection() snapshots it at menu-open
     * time and getSelection() falls back to that snapshot.
     * @returns {string} Selected text or empty string
     */
    var savedSelection = '';

    function captureSelection() {
      var text = '';
      if (term) {
        text = term.getSelection() || '';
      }
      if (text.length === 0 && window.getSelection) {
        text = String(window.getSelection());
      }
      if (text.length > 0) {
        savedSelection = text;
      }
      return text;
    }

    function getSelection() {
      var text = captureSelection();
      if (text.length > 0) {
        return text;
      }
      return savedSelection;
    }

    /**
     * Clear terminal selection.
     */
    function clearSelection() {
      savedSelection = '';
      if (term) {
        term.clearSelection();
      }
      if (window.getSelection) {
        var sel = window.getSelection();
        if (sel.rangeCount > 0) {
          sel.removeAllRanges();
        }
      }
    }

    /**
     * Get current terminal dimensions.
     * @returns {string} JSON with cols and rows
     */
    function getTerminalSize() {
      if (term) {
        return JSON.stringify({ cols: term.cols, rows: term.rows });
      }
      return JSON.stringify({ cols: 80, rows: 24 });
    }

    /** Map a viewport coordinate to a terminal cell, null when outside. */
    function cellAt(clientX, clientY) {
      if (!term || !terminalContainer) return null;
      var rowsEl = terminalContainer.querySelector('.xterm-rows');
      if (!rowsEl) return null;
      var rect = rowsEl.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return null;
      var col = Math.floor((clientX - rect.left) / (rect.width / term.cols));
      var row = Math.floor((clientY - rect.top) / (rect.height / term.rows));
      if (col < 0 || col >= term.cols || row < 0 || row >= term.rows) return null;
      return { col: col, row: row };
    }

    /**
     * Same mapping, but a point outside the grid clamps to the nearest cell.
     * A selection drag that leaves the screen has to stop at the edge cell;
     * returning null there would freeze the highlight mid-gesture.
     */
    function cellAtClamped(clientX, clientY) {
      if (!term || !terminalContainer) return null;
      var rowsEl = terminalContainer.querySelector('.xterm-rows');
      if (!rowsEl) return null;
      var rect = rowsEl.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return null;
      var col = Math.floor((clientX - rect.left) / (rect.width / term.cols));
      var row = Math.floor((clientY - rect.top) / (rect.height / term.rows));
      col = Math.max(0, Math.min(col, term.cols - 1));
      row = Math.max(0, Math.min(row, term.rows - 1));
      return { col: col, row: row };
    }

    /** True when the foreground app asked for mouse reports (DECSET 1000/1002/1003). */
    function mouseReportingActive() {
      return !!term && term.modes.mouseTrackingMode !== 'none';
    }

    /** SGR (1006) mouse report: cells are 1-based, 'M' = press, 'm' = release. */
    function sgrMouseReport(button, col, row, pressed) {
      return '\x1b[<' + button + ';' + (col + 1) + ';' + (row + 1) + (pressed ? 'M' : 'm');
    }

    /** Send one mouse report to the app through xterm's input path (→ onData → PTY). */
    function sendMouseReport(button, col, row, pressed) {
      if (!term) return;
      term.input(sgrMouseReport(button, col, row, pressed));
    }

    /**
     * Select the exact cell range between two viewport cells. xterm's select()
     * takes a cell count, and its selection model wraps that count across rows,
     * so one call covers a multi-row drag — without the whole-line highlight that
     * selectLines() paints to the right edge of the screen. Selection coordinates
     * are buffer rows, so the viewport offset has to be added.
     */
    function selectCellRange(anchor, cur) {
      if (!term || !anchor || !cur) return;
      var cols = term.cols;
      var ydisp = term.buffer.active.viewportY;
      var a = (anchor.row + ydisp) * cols + anchor.col;
      var b = (cur.row + ydisp) * cols + cur.col;
      var start = Math.min(a, b);
      var end = Math.max(a, b);
      term.select(start % cols, Math.floor(start / cols), end - start + 1);
    }

    /**
     * Word range around a viewport cell on its line; a single cell for whitespace.
     * The row is returned in viewport coordinates (callers add viewportY to reach
     * the buffer row), matching cellAt/cellAtClamped.
     */
    function wordRangeAt(col, row) {
      var line = term.buffer.active.getLine(row + term.buffer.active.viewportY);
      if (!line) return null;
      var text = line.translateToString(true);
      if (!text) return null;
      if (col >= text.length) col = text.length - 1;
      var isWord = function(ch) { return /\S/.test(ch); };
      if (!isWord(text.charAt(col))) {
        return { col: col, row: row, length: 1 };
      }
      var start = col;
      var end = col;
      while (start > 0 && isWord(text.charAt(start - 1))) start--;
      while (end < text.length - 1 && isWord(text.charAt(end + 1))) end++;
      return { col: start, row: row, length: end - start + 1 };
    }

    /**
     * Tap-to-move: nudge the shell cursor toward the tapped column with arrow
     * keys — same viewport row only, and only when the viewport sits at the
     * bottom (taps in scrolled-back history don't map to the live cursor).
     * Skipped in the alternate screen, where apps own the cursor.
     */
    function handleTapToMove(clientX, clientY) {
      if (!term) return;
      var buf = term.buffer.active;
      if (buf.type === 'alternate') return;
      if (buf.viewportY < buf.length - term.rows) return;
      var cell = cellAt(clientX, clientY);
      if (!cell) return;
      var dCol = cell.col - buf.cursorX;
      var dRow = cell.row - buf.cursorY;
      if (dRow !== 0 || dCol === 0 || Math.abs(dCol) > 60) return;
      var out = '';
      for (var i = 0; i < Math.abs(dCol); i++) {
        out += (dCol > 0) ? '\x1b[C' : '\x1b[D';
      }
      term.input(out);
    }

    /**
     * Select the whole active buffer (context menu 全选).
     */
    function selectAllTerminal() {
      if (term) {
        term.selectAll();
      }
    }

    /**
     * Paste text through xterm so bracketed-paste mode is honored.
     */
    function pasteText(text) {
      if (term && text) {
        term.paste(text);
      }
    }

    /**
     * '1' when the terminal holds a selection, '0' otherwise.
     */
    function hasSelection() {
      return getSelection().length > 0 ? '1' : '0';
    }

    /**
     * Selection state for the host context menu, as a JSON object: a bare '1'
     * crossing the runJavaScript bridge loses its type, so the host reads a named
     * field instead of pattern-matching a stringified value.
     */
    function selectionStateJson() {
      return JSON.stringify({ hasSelection: getSelection().length > 0 });
    }

    // === Scrollback snapshot (serialize → host file → restore) ===
    // The host persists the serialized ANSI stream per worker so reopening a
    // session restores full scrollback — server replay is capped (512KB) and
    // lost entirely on worker restart. Restore replays via term.write, so new
    // live output continues BELOW the restored history (Windows-Terminal-style
    // concat instead of reset-and-replace).
    var SNAPSHOT_CHUNK = 262144; // 256KB per port message

    /**
     * Serialize the full buffer (screen + scrollback) and stream it to the
     * host in snapshotStart, snapshotChunk and snapshotEnd port messages.
     * Called by the host on idle / page exit / app background — never on the
     * write hot path (serializing 64k lines is a synchronous job, 100ms+).
     */
    function startSnapshotCapture() {
      if (!term || !serializeAddon) return;
      var data;
      try {
        data = serializeAddon.serialize();
      } catch (e) {
        console.error('[snapshot] serialize failed: ' + e.message);
        sendToHost({ type: 'snapshotFailed', message: e.message });
        return;
      }
      var total = Math.max(Math.ceil(data.length / SNAPSHOT_CHUNK), 1);
      sendToHost({ type: 'snapshotStart', total: total });
      for (var i = 0; i < total; i++) {
        sendToHost({ type: 'snapshotChunk', seq: i, data: data.substr(i * SNAPSHOT_CHUNK, SNAPSHOT_CHUNK) });
      }
      sendToHost({ type: 'snapshotEnd', total: total, bytes: data.length });
    }

    /**
     * Append one JSON-encoded fragment of a previously captured snapshot to
     * the buffer. Fragments must be invoked in capture order — runJavaScript
     * guarantees FIFO, so the host needs no extra sequencing here.
     */
    function restoreSnapshotChunk(json) {
      if (!term) return;
      var chunk = JSON.parse(json);
      term.write(chunk.data);
    }

    /**
     * Visual boundary between a previous terminal's restored output and the
     * live output of the freshly attached one (Windows-Terminal restart-shell
     * style). Dim-styled so it reads as a marker, not content.
     */
    function writeDivider(text) {
      if (!term) return;
      term.write('\x1b[2m\r\n──── ' + text + ' ────\x1b[0m\r\n');
    }

    // === Window resize handling ===
    // Debounced 150ms (MAUI parity): keyboard show/hide fires window resize per
    // animation frame; an undebounced fit() reflows the whole 64k-row scrollback
    // and redraws per intermediate size (visible flicker). One fit after settle.
    var resizeFitTimer = null;
    window.addEventListener('resize', function() {
      if (!fitAddon) return;
      if (resizeFitTimer) clearTimeout(resizeFitTimer);
      resizeFitTimer = setTimeout(function() {
        resizeFitTimer = null;
        try {
          fitAddon.fit();
        } catch(e) {
          console.warn('fitAddon.fit() failed:', e);
        }
      }, 150);
    });
  </script>
</body>
</html>
