<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CortexTerminal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #terminal-container {
      width: 100%;
      height: 100%;
      background-color: #121414;
      overflow: hidden;
    }
    /* Prevent text selection on long press */
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    /* Allow text selection inside terminal */
    .xterm {
      user-select: text;
      -webkit-user-select: text;
    }

  </style>
  <link rel="stylesheet" href="xterm.css" />
</head>
<body>
  <div id="terminal-container"></div>

  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>
  <script src="xterm-addon-webgl.js"></script>

  <script>
    // === Globals ===
    let term = null;
    let fitAddon = null;
    let terminalContainer = null;

    // === WebMessagePort 通信 ===
    var h5Port;
    function sendToHost(msg) {
      if (h5Port) {
        h5Port.postMessage(JSON.stringify(msg));
      }
    }
    window.addEventListener('message', function(event) {
      if (event.data === '__init_port__') {
        if (event.ports[0]) {
          h5Port = event.ports[0];
          console.log('h5Port initialized');
        }
      }
    });

    // === Bridge functions (called from ArkTS via runJavaScript) ===

    /**
     * Initialize xterm.js terminal instance.
     * @param {number} cols - Initial columns (default 80)
     * @param {number} rows - Initial rows (default 24)
     */
    function initTerminal(cols, rows, useWebGL) {
      if (term) {
        term.dispose();
      }

      cols = cols || 80;
      rows = rows || 24;

      term = new Terminal({
        cols: cols,
        rows: rows,
        cursorBlink: true,
        cursorStyle: 'bar',
        fontSize: 14,
        fontFamily: 'monospace',
        theme: {
          background: '#121414',
          foreground: '#e3e2e2',
          cursor: '#9fcaff',
          cursorAccent: '#121414',
          selectionBackground: '#3a95e8',
          black: '#3a3d3d',
          red: '#ffb4ab',
          green: '#a2d489',
          yellow: '#ffd180',
          blue: '#9fcaff',
          magenta: '#f5a8d0',
          cyan: '#80cbc4',
          white: '#e3e2e2',
          brightBlack: '#8e9192',
          brightRed: '#ffb4ab',
          brightGreen: '#a2d489',
          brightYellow: '#ffd180',
          brightBlue: '#9fcaff',
          brightMagenta: '#f5a8d0',
          brightCyan: '#80cbc4',
          brightWhite: '#e3e2e2'
        },
        scrollback: 64000,
        allowProposedApi: true,
        allowTransparency: false
      });

      fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);

      const container = document.getElementById('terminal-container');
      terminalContainer = container;
      term.open(container);

      // Register resize handler BEFORE fit() so the initial resize event is captured.
      // Debounced 150ms (MAUI parity: RESIZE_DEBOUNCE_MS): keyboard animation produces
      // many intermediate sizes; sending each one SIGWINCHes the server, making
      // full-screen apps redraw per intermediate size (the residual "刷屏").
      var resizeSyncTimer = null;
      var pendingSize = null;
      term.onResize(function(size) {
        pendingSize = size;
        if (resizeSyncTimer) clearTimeout(resizeSyncTimer);
        resizeSyncTimer = setTimeout(function() {
          resizeSyncTimer = null;
          if (h5Port && pendingSize) {
            h5Port.postMessage(JSON.stringify({ type: 'resize', cols: pendingSize.cols, rows: pendingSize.rows }));
            pendingSize = null;
          }
        }, 150);
      });

      // Fit immediately to ensure correct size before any output arrives
      try {
        fitAddon.fit();
      } catch(e) {
        console.warn('fitAddon.fit() failed:', e);
      }

      // Forward user input to ArkTS via WebMessagePort (MUST register before WebGL,
      // so a renderer init failure can never break input — VS Code applies the same pattern)
      term.onData(function(data) {
        if (h5Port) {
          h5Port.postMessage(JSON.stringify({ type: 'input', data: data }));
        } else {
          console.error('h5Port is NULL, input dropped: ' + JSON.stringify(data));
          document.title = 'h5Port NULL!';
        }
      });

      // === Renderer: WebGL (user-controlled via settings) ===
      // ArkWeb API20+ emulators have a GPU regression where WebGL canvas
      // renders pure black. Users can disable GPU acceleration in Settings
      // to fall back to the DOM renderer (slightly slower but works everywhere).

      if (useWebGL !== false) {
        try {
          // Monkey-patch mainDocument — required for WebGL context on ArkWeb.
          var core = term._core;
          if (core && core._coreBrowserService) {
            core._coreBrowserService.mainDocument = document;
          }
          var webglAddon = new WebglAddon.WebglAddon();
          term.loadAddon(webglAddon);
          webglAddon.onContextLoss(function() {
            console.error('[XtermWebview] WebGL context lost');
          });
          console.info('[XtermWebview] WebGL renderer enabled');
        } catch(e) {
          console.warn('[XtermWebview] WebGL failed: ' + e.message + ' — using DOM');
        }
      } else {
        console.info('[XtermWebview] DOM renderer active (GPU acceleration disabled)');
      }

      // === Custom touch scroll (ported from MAUI useTouchScroll.ts) ===
      // xterm 6.0 WebGL doesn't support touch scroll natively — SmoothScrollableElement
      // only listens for wheel events, and the page is overflow:hidden so the browser
      // doesn't synthesize wheel from touch. MAUI solved this in useTouchScroll.ts;
      // this is a 1:1 native-JS port.
      //   - long press 500ms → enter selection mode (let xterm handle the touch)
      //   - move > 10px before long press fires → cancel long press, scroll mode
      //   - touchmove: passive:false + preventDefault, accumulate dy, scrollLines(±)
      //   - touchend: if velocity > 0.5, requestAnimationFrame inertia loop (0.95 decay)
      (function setupTouchScroll() {
        var PIXELS_PER_LINE = 17;
        var FRICTION = 0.95;
        var MIN_VELOCITY = 0.5;
        var LONG_PRESS_MS = 500;
        var MOVE_THRESHOLD = 10;

        var st = null; // { accumulated, lastY, lastTime, rafId, velocity, startY, longPressTimer, selecting }

        function clearLongPress(s) {
          if (s.longPressTimer) {
            clearTimeout(s.longPressTimer);
            s.longPressTimer = null;
          }
        }

        container.addEventListener('touchstart', function(e) {
          if (e.touches.length !== 1) return;
          // Any new touch dismisses the host context menu.
          sendToHost({ type: 'contextmenuhide' });
          if (st && st.rafId) cancelAnimationFrame(st.rafId);

          var s = {
            accumulated: 0,
            lastY: e.touches[0].clientY,
            lastTime: Date.now(),
            rafId: 0,
            velocity: 0,
            startY: e.touches[0].clientY,
            startX: e.touches[0].clientX,
            startMs: Date.now(),
            totalDelta: 0,
            anchor: null,
            longPressTimer: null,
            selecting: false
          };

          // Long-press timer: after 500ms of no movement, switch to selection mode.
          // Focus the xterm helper textarea and dispatch a synthetic touchstart on
          // the real target under the finger so xterm's selection picks it up.
          s.longPressTimer = setTimeout(function() {
            s.selecting = true;
            s.anchor = cellAt(s.startX, s.startY);
            var textarea = container.querySelector('.xterm-helper-textarea');
            if (textarea) textarea.focus();
            // Long-press selects the word under the finger directly through
            // xterm's select() API — the synthetic-touch approach never fired
            // reliably on ArkWeb.
            if (s.anchor) {
              var wr = wordRangeAt(s.anchor.col, s.anchor.row);
              if (wr) {
                term.select(wr.col, wr.row, wr.length);
              }
            }
          }, LONG_PRESS_MS);

          st = s;
        }, { passive: true });

        container.addEventListener('touchmove', function(e) {
          if (!st || e.touches.length !== 1) return;
          var s = st;

          var currentY = e.touches[0].clientY;
          var totalDelta = Math.max(
            Math.abs(currentY - s.startY),
            Math.abs(e.touches[0].clientX - s.startX));
          s.totalDelta = totalDelta;

          // Movement beyond threshold before long-press fires → cancel selection intent
          if (!s.selecting && totalDelta > MOVE_THRESHOLD) {
            clearLongPress(s);
          }

          // Selection mode: extend the selection ourselves (xterm's touch
          // selection is unreliable on ArkWeb — drive term.select directly).
          if (s.selecting) {
            e.preventDefault();
            var cur = cellAt(e.touches[0].clientX, e.touches[0].clientY);
            if (cur && s.anchor) {
              var cols = term.cols;
              var a = s.anchor.row * cols + s.anchor.col;
              var b = cur.row * cols + cur.col;
              if (a !== b) {
                if (Math.floor(Math.min(a, b) / cols) === Math.floor(Math.max(a, b) / cols)) {
                  // Same row: exact cell range
                  var start = Math.min(a, b);
                  term.select(start % cols, Math.floor(start / cols), Math.abs(b - a) + 1);
                } else {
                  // Multi-row: whole-line selection between the rows
                  term.selectLines(Math.min(s.anchor.row, cur.row), Math.max(s.anchor.row, cur.row));
                }
              }
            }
            return;
          }

          e.preventDefault();

          var deltaY = s.lastY - currentY;
          var now = Date.now();
          var dt = now - s.lastTime;
          if (dt > 0) s.velocity = deltaY / dt;

          s.lastY = currentY;
          s.lastTime = now;
          s.accumulated += deltaY;

          var lines = Math.trunc(s.accumulated / PIXELS_PER_LINE);
          if (lines !== 0) {
            term.scrollLines(lines);
            s.accumulated -= lines * PIXELS_PER_LINE;
          }
        }, { passive: false });

        container.addEventListener('touchend', function(e) {
          if (!st) return;
          var s = st;
          clearLongPress(s);

          if (s.selecting) {
            st = null;
            // Selection finalized — ask the host for the context menu
            // (复制/全选/粘贴/取消) at the lift point.
            var lift = e.changedTouches[0];
            sendToHost({ type: 'contextmenu', x: lift ? lift.clientX : s.startX, y: lift ? lift.clientY : s.startY });
            return;
          }

          if (Math.abs(s.velocity) > MIN_VELOCITY) {
            var inertiaScroll = function() {
              if (!st) return;
              var cur = st;
              cur.velocity *= FRICTION;
              if (Math.abs(cur.velocity) < MIN_VELOCITY * 0.1) {
                st = null;
                return;
              }
              var delta = cur.velocity * 16;
              cur.accumulated += delta;
              var lines = Math.trunc(cur.accumulated / PIXELS_PER_LINE);
              if (lines !== 0) {
                term.scrollLines(lines);
                cur.accumulated -= lines * PIXELS_PER_LINE;
              }
              cur.rafId = requestAnimationFrame(inertiaScroll);
            };
            s.rafId = requestAnimationFrame(inertiaScroll);
          } else {
            st = null;
            // Short tap: refocus the terminal and nudge the shell cursor toward
            // the tapped column (same viewport row only — cross-row arrow
            // sequences are ambiguous in raw-mode shells).
            var tap = e.changedTouches[0];
            var heldMs = Date.now() - s.startMs;
            if (tap && s.totalDelta <= MOVE_THRESHOLD && heldMs < LONG_PRESS_MS) {
              var textarea = container.querySelector('.xterm-helper-textarea');
              if (textarea) textarea.focus();
              handleTapToMove(tap.clientX, tap.clientY);
            }
          }
        }, { passive: true });

        console.info('[XtermWebview] touch scroll installed (ported from MAUI)');
      })();

      console.log('Terminal initialized: ' + cols + 'x' + rows);
    }

    /**
     * Write raw string data to the terminal.
     * @param {string} data - Terminal escape sequence data
     */
    function writeOutput(data) {
      if (term) {
        term.write(data);
      }
    }

    /**
     * Decode base64 to bytes and write to terminal.
     * Shared by single-frame and batched write paths.
     * Normalizes bare \n to \r\n to prevent the staircase effect.
     */
    function decodeAndWrite(b64) {
      var binaryStr = atob(b64);
      var bytes = new Uint8Array(binaryStr.length);
      for (var i = 0; i < binaryStr.length; i++) {
        bytes[i] = binaryStr.charCodeAt(i) & 0xFF;
      }
      var text = new TextDecoder().decode(bytes);
      if (text.indexOf('\n') !== -1) {
        text = text.replace(/(?<!\r)\n/g, '\r\n');
        bytes = new TextEncoder().encode(text);
      }
      term.write(bytes);
    }

    /**
     * Write a single base64-encoded frame to the terminal.
     * @param {string} base64Data - Base64 encoded output data
     */
    function writeBase64Output(base64Data) {
      if (term && base64Data) {
        decodeAndWrite(base64Data);
      }
    }

    /**
     * Write multiple base64-encoded frames in one JS bridge call.
     * Frames are joined with '|' (base64 charset A-Za-z0-9+/= does not include '|').
     * @param {string} packed - '|' separated base64 frames
     */
    function writeBatchedOutput(packed) {
      if (!term || !packed) return;
      var frames = packed.split('|');
      for (var i = 0; i < frames.length; i++) {
        decodeAndWrite(frames[i]);
      }
    }

    /**
     * Resize the terminal to new dimensions.
     * @param {number} cols
     * @param {number} rows
     */
    function resizeTerminal(cols, rows) {
      if (term) {
        term.resize(cols, rows);
      }
    }

    /**
     * Fit the terminal to its container.
     */
    function fitTerminal() {
      if (fitAddon) {
        try {
          fitAddon.fit();
        } catch(e) {
          console.warn('fitAddon.fit() failed:', e);
        }
      }
    }

    /**
     * Clear the terminal screen.
     */
    function clearTerminal() {
      if (term) {
        term.clear();
      }
    }

    /**
     * Reset the terminal completely.
     */
    function resetTerminal() {
      if (term) {
        term.reset();
      }
    }

    /**
     * Get current terminal selection.
     * @returns {string} Selected text or empty string
     */
    function getSelection() {
      if (term) {
        return term.getSelection() || '';
      }
      return '';
    }

    /**
     * Clear terminal selection.
     */
    function clearSelection() {
      if (term) {
        term.clearSelection();
      }
    }

    /**
     * Get current terminal dimensions.
     * @returns {string} JSON with cols and rows
     */
    function getTerminalSize() {
      if (term) {
        return JSON.stringify({ cols: term.cols, rows: term.rows });
      }
      return JSON.stringify({ cols: 80, rows: 24 });
    }

    /** Map a viewport coordinate to a terminal cell, null when outside. */
    function cellAt(clientX, clientY) {
      if (!term || !terminalContainer) return null;
      var rowsEl = terminalContainer.querySelector('.xterm-rows');
      if (!rowsEl) return null;
      var rect = rowsEl.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return null;
      var col = Math.floor((clientX - rect.left) / (rect.width / term.cols));
      var row = Math.floor((clientY - rect.top) / (rect.height / term.rows));
      if (col < 0 || col >= term.cols || row < 0 || row >= term.rows) return null;
      return { col: col, row: row };
    }

    /** Word range around a cell on its line; a single cell for whitespace. */
    function wordRangeAt(col, row) {
      var line = term.buffer.active.getLine(row);
      if (!line) return null;
      var text = line.translateToString(true);
      if (!text) return null;
      if (col >= text.length) col = text.length - 1;
      var isWord = function(ch) { return /\S/.test(ch); };
      if (!isWord(text.charAt(col))) {
        return { col: col, length: 1 };
      }
      var start = col;
      var end = col;
      while (start > 0 && isWord(text.charAt(start - 1))) start--;
      while (end < text.length - 1 && isWord(text.charAt(end + 1))) end++;
      return { col: start, length: end - start + 1 };
    }

    /**
     * Tap-to-move: nudge the shell cursor toward the tapped column with arrow
     * keys — same viewport row only, and only when the viewport sits at the
     * bottom (taps in scrolled-back history don't map to the live cursor).
     * Skipped in the alternate screen, where apps own the cursor.
     */
    function handleTapToMove(clientX, clientY) {
      if (!term) return;
      var buf = term.buffer.active;
      if (buf.type === 'alternate') return;
      if (buf.viewportY < buf.length - term.rows) return;
      var cell = cellAt(clientX, clientY);
      if (!cell) return;
      var dCol = cell.col - buf.cursorX;
      var dRow = cell.row - buf.cursorY;
      if (dRow !== 0 || dCol === 0 || Math.abs(dCol) > 60) return;
      var out = '';
      for (var i = 0; i < Math.abs(dCol); i++) {
        out += (dCol > 0) ? '\x1b[C' : '\x1b[D';
      }
      if (term.onData) {
        term.onData(out);
      }
    }

    /**
     * Select the whole active buffer (context menu 全选).
     */
    function selectAllTerminal() {
      if (term) {
        term.selectAll();
      }
    }

    /**
     * Paste text through xterm so bracketed-paste mode is honored.
     */
    function pasteText(text) {
      if (term && text) {
        term.paste(text);
      }
    }

    /**
     * '1' when the terminal holds a selection, '0' otherwise.
     */
    function hasSelection() {
      return (term && term.hasSelection()) ? '1' : '0';
    }

    // === Window resize handling ===
    // Debounced 150ms (MAUI parity): keyboard show/hide fires window resize per
    // animation frame; an undebounced fit() reflows the whole 64k-row scrollback
    // and redraws per intermediate size (visible flicker). One fit after settle.
    var resizeFitTimer = null;
    window.addEventListener('resize', function() {
      if (!fitAddon) return;
      if (resizeFitTimer) clearTimeout(resizeFitTimer);
      resizeFitTimer = setTimeout(function() {
        resizeFitTimer = null;
        try {
          fitAddon.fit();
        } catch(e) {
          console.warn('fitAddon.fit() failed:', e);
        }
      }, 150);
    });
  </script>
</body>
</html>
