name: Worker UI Release

# Flutter 桌面控制面板（云枢终端）。与 worker 分开发布：
# - worker 走 worker-release.yml（worker-v* tag）
# - UI 走这里（ui-v* tag），构建时下载最新 worker release 的二进制打进 assets/bin，
#   保证「装 UI 即带 worker」用的是正式 worker 版本。
on:
  push:
    tags: ['ui-v*']

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS UI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Test
        working-directory: src/Flutter/worker_ui
        run: flutter test

      - name: Download worker binaries (osx-arm64)
        run: |
          # v0.5.21 起 cortap 退役（hooks 注入取代），UI 不再捆绑 cortap。
          # 动态取最新 worker release：硬编码版本曾让发布的 UI 内置落后 3 个
          # 版本的 worker，协议失配不可用（ui-v* tag 全部 4 个 job 同此逻辑）。
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '
            [.[].tag_name
              | select(test("^worker-v[0-9]+\\.[0-9]+\\.[0-9]+$"))
              | {tag: ., parts: (ltrimstr("worker-v") | split(".") | map(tonumber))}]
            | sort_by(.parts) | last | .tag')
          test -n "$latest" || { echo "::error::no worker-v* release found"; exit 1; }
          echo "bundling worker release: $latest"
          echo "WORKER_TAG=$latest" >> "$GITHUB_ENV"
          mkdir -p /tmp/worker src/Flutter/worker_ui/assets/bin
          gh release download "$latest" --pattern 'corterm-osx-arm64.tar.gz' --dir /tmp/worker
          tar -xzf /tmp/worker/corterm-osx-arm64.tar.gz -C /tmp/worker
          cp /tmp/worker/corterm /tmp/worker/appsettings.json src/Flutter/worker_ui/assets/bin/
          test -s src/Flutter/worker_ui/assets/bin/corterm
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/ui-v}" >> "$GITHUB_OUTPUT"

      - name: Build release
        working-directory: src/Flutter/worker_ui
        env:
          UI_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          flutter pub get
          # --build-name 同时写进 macOS CFBundleShortVersionString 和 Windows exe 版本资源
          flutter build macos --release --dart-define=UI_VERSION="$UI_VERSION" --build-name="$UI_VERSION"

      - name: Guard bundled worker
        run: |
          # 护栏：worker 必须真的进了 .app 且版本与下载的 release 一致
          # （ui-v0.1.0 曾因资产声明漏 .exe 发过没有 worker 的包）。
          APP=src/Flutter/worker_ui/build/macos/Build/Products/Release/Corterm.app
          BIN=""
          for c in \
            "$APP/Contents/Resources/flutter_assets/assets/bin/corterm" \
            "$APP/Contents/Frameworks/App.framework/Versions/A/Resources/flutter_assets/assets/bin/corterm"; do
            if [ -f "$c" ]; then BIN="$c"; break; fi
          done
          test -n "$BIN" || { echo "::error::bundled worker missing from Corterm.app"; exit 1; }
          test -f "$(dirname "$BIN")/appsettings.json" || { echo "::error::appsettings.json missing next to worker"; exit 1; }
          prefix="${WORKER_TAG#worker-v}"
          ver=$("$BIN" --version | head -n1)
          case "$ver" in
            "$prefix"|"$prefix"-*|"$prefix"+*) ;;
            *) echo "::error::bundled worker version '$ver' does not match $WORKER_TAG"; exit 1 ;;
          esac
          echo "bundled worker OK: $ver"

      - name: Package .dmg
        run: |
          # 标准 macOS 拖拽安装包：.app + /Applications 快捷方式
          # 固定文件名（不带版本号）：self_updater.dart 通过 releases/latest/download 直达
          mkdir -p /tmp/dmg-root
          cp -R src/Flutter/worker_ui/build/macos/Build/Products/Release/Corterm.app /tmp/dmg-root/
          ln -s /Applications /tmp/dmg-root/Applications
          hdiutil create -volname "云枢终端" -srcfolder /tmp/dmg-root -ov \
            -format UDZO /tmp/corterm-ui-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: worker-ui-macos
          path: /tmp/corterm-ui-macos.dmg

  build-windows:
    name: Build Windows UI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Test
        working-directory: src/Flutter/worker_ui
        run: flutter test

      - name: Download worker binaries (win-x64)
        shell: bash
        run: |
          # v0.5.21 起 cortap 退役（hooks 注入取代），UI 不再捆绑 cortap。
          # 动态取最新 worker release（同 build-macos，防硬编码版本落后）。
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '
            [.[].tag_name
              | select(test("^worker-v[0-9]+\\.[0-9]+\\.[0-9]+$"))
              | {tag: ., parts: (ltrimstr("worker-v") | split(".") | map(tonumber))}]
            | sort_by(.parts) | last | .tag')
          test -n "$latest" || { echo "::error::no worker-v* release found"; exit 1; }
          echo "bundling worker release: $latest"
          echo "WORKER_TAG=$latest" >> "$GITHUB_ENV"
          mkdir -p /tmp/worker src/Flutter/worker_ui/assets/bin
          gh release download "$latest" --pattern 'corterm-win-x64.zip' --dir /tmp/worker
          cd /tmp/worker && unzip -o corterm-win-x64.zip -d win && cd -
          cp /tmp/worker/win/corterm.exe /tmp/worker/win/appsettings.json src/Flutter/worker_ui/assets/bin/
          # assets/bin 声明为目录资产，repo 里提交的 mac 二进制会被一起打进 Windows
          # 包（白胖 40MB 死重）——拷入 .exe 后清掉 Unix 名的旧文件。
          rm -f src/Flutter/worker_ui/assets/bin/corterm
          test -s src/Flutter/worker_ui/assets/bin/corterm.exe
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/ui-v}" >> "$GITHUB_OUTPUT"

      - name: Build release
        working-directory: src/Flutter/worker_ui
        env:
          UI_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          flutter pub get
          flutter build windows --release --dart-define=UI_VERSION="$UI_VERSION" --build-name="$UI_VERSION"

      - name: Guard bundled worker
        shell: bash
        run: |
          # 护栏：worker 必须真的进了构建产物且版本与下载的 release 一致。
          BIN="src/Flutter/worker_ui/build/windows/x64/runner/Release/Data/flutter_assets/assets/bin/corterm.exe"
          test -f "$BIN" || { echo "::error::bundled worker missing from build output"; exit 1; }
          test -f "$(dirname "$BIN")/appsettings.json" || { echo "::error::appsettings.json missing next to worker"; exit 1; }
          prefix="${WORKER_TAG#worker-v}"
          ver=$("$BIN" --version | head -n1)
          case "$ver" in
            "$prefix"|"$prefix"-*|"$prefix"+*) ;;
            *) echo "::error::bundled worker version '$ver' does not match $WORKER_TAG"; exit 1 ;;
          esac
          echo "bundled worker OK: $ver"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (.exe)
        working-directory: src/Flutter/worker_ui
        run: iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" worker-ui.iss

      - uses: actions/upload-artifact@v4
        with:
          name: worker-ui-windows
          path: src/Flutter/worker_ui/release/*.exe

  build-linux:
    name: Build Linux UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux deps
        run: |
          sudo apt-get update
          # libayatana-appindicator3-dev: tray_manager 插件要求（Linux 托盘）
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev liblzma-dev libayatana-appindicator3-dev

      - name: Test
        working-directory: src/Flutter/worker_ui
        run: flutter test

      - name: Download worker binaries (linux-x64)
        run: |
          # v0.5.21 起 cortap 退役（hooks 注入取代），UI 不再捆绑 cortap。
          # 动态取最新 worker release（同 build-macos，防硬编码版本落后）。
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '
            [.[].tag_name
              | select(test("^worker-v[0-9]+\\.[0-9]+\\.[0-9]+$"))
              | {tag: ., parts: (ltrimstr("worker-v") | split(".") | map(tonumber))}]
            | sort_by(.parts) | last | .tag')
          test -n "$latest" || { echo "::error::no worker-v* release found"; exit 1; }
          echo "bundling worker release: $latest"
          echo "WORKER_TAG=$latest" >> "$GITHUB_ENV"
          mkdir -p /tmp/worker src/Flutter/worker_ui/assets/bin
          gh release download "$latest" --pattern 'corterm-linux-x64.tar.gz' --dir /tmp/worker
          tar -xzf /tmp/worker/corterm-linux-x64.tar.gz -C /tmp/worker
          cp /tmp/worker/corterm /tmp/worker/appsettings.json src/Flutter/worker_ui/assets/bin/
          test -s src/Flutter/worker_ui/assets/bin/corterm
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build release
        working-directory: src/Flutter/worker_ui
        run: |
          flutter pub get
          flutter build linux --release

      - name: Guard bundled worker
        run: |
          # 护栏：worker 必须真的进了构建产物且版本与下载的 release 一致。
          # bundle 里的资产权限被 CMake install 归一成 644（App 复制到 ~/.corterm
          # 时会自行 chmod +x），所以这里只查存在性，探版本前临时补 +x。
          BIN="src/Flutter/worker_ui/build/linux/x64/release/bundle/data/flutter_assets/assets/bin/corterm"
          test -f "$BIN" || { echo "::error::bundled worker missing from build output"; exit 1; }
          test -f "$(dirname "$BIN")/appsettings.json" || { echo "::error::appsettings.json missing next to worker"; exit 1; }
          chmod +x "$BIN"
          prefix="${WORKER_TAG#worker-v}"
          ver=$("$BIN" --version | head -n1)
          case "$ver" in
            "$prefix"|"$prefix"-*|"$prefix"+*) ;;
            *) echo "::error::bundled worker version '$ver' does not match $WORKER_TAG"; exit 1 ;;
          esac
          echo "bundled worker OK: $ver"

      - name: Package
        run: |
          tar -czf /tmp/worker-ui-linux.tar.gz -C src/Flutter/worker_ui/build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: worker-ui-linux
          path: /tmp/worker-ui-linux.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      # gh release create 需要 git repo 上下文，否则报 "not a git repository"
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            /tmp/artifacts/worker-ui-macos/corterm-ui-macos.dmg \
            /tmp/artifacts/worker-ui-windows/*.exe \
            /tmp/artifacts/worker-ui-linux/worker-ui-linux.tar.gz \
            --title "云枢终端 UI $tag" \
            --notes "Worker UI (云枢终端) — 桌面控制面板。内置 worker 二进制。"
