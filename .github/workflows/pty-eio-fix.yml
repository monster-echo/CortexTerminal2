name: PTY EIO fix verification
on:
  push:
    branches: [codex/pty-eio-fix]
permissions:
  contents: read
jobs:
  pty-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.202'
      - name: Run Linux PTY integration tests
        run: |
          dotnet test tests/Worker/CortexTerminal.Worker.Tests/CortexTerminal.Worker.Tests.csproj \
            --configuration Release \
            --filter "Category=Integration" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=integration.trx" \
            --results-directory "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pty-eio-fix
          path: ${{ runner.temp }}/results
          retention-days: 7
