name: Worker isolated stress comparison
on:
  push:
    branches: [codex/pty-observer-stress]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, dedicated-observer]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.202'
      - name: Select baseline observer
        if: matrix.variant == 'baseline'
        run: git show 597704289f96ac6987427611ef158d7d467a8783:src/Worker/CortexTerminal.Worker/Pty/UnixPtyProcess.cs > src/Worker/CortexTerminal.Worker/Pty/UnixPtyProcess.cs
      - name: Worker tests
        continue-on-error: true
        run: dotnet test tests/Worker/CortexTerminal.Worker.Tests/CortexTerminal.Worker.Tests.csproj --configuration Release
      - name: Build isolated Linux worker
        run: dotnet publish src/Worker/CortexTerminal.Worker/CortexTerminal.Worker.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o comparison
      - uses: actions/upload-artifact@v4
        with:
          name: worker-stress-${{ matrix.variant }}
          path: comparison/
          retention-days: 7
