name: iOS Simulator Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-keychain:
    name: iOS Simulator Keychain & App Build
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/Flutter/corterm_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Boot iPhone simulator
        id: simulator
        shell: bash
        run: |
          device_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for xs in d["devices"].values() for x in xs if x["isAvailable"] and x["name"].startswith("iPhone")))')"
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b

      - name: Build simulator app
        run: flutter build ios --simulator --debug

      - name: Package simulator app without flattening bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app corterm-ios-simulator.zip

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: corterm-ios-simulator
          path: src/Flutter/corterm_mobile/corterm-ios-simulator.zip
          if-no-files-found: error

      - name: Install and launch app in simulator
        run: |
          xcrun simctl install "${{ steps.simulator.outputs.device_id }}" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "${{ steps.simulator.outputs.device_id }}" top.rwecho.cortexterminal

      - name: Verify iOS Keychain access
        run: flutter test integration_test/ios_keychain_smoke_test.dart -d "${{ steps.simulator.outputs.device_id }}"
