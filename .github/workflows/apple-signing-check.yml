name: Apple signing credentials check
on:
  workflow_dispatch:
  push:
    branches: [codex/apple-signing-check]
    paths: [.github/workflows/apple-signing-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15
    steps:
      - name: Inspect existing signing credentials without exporting private keys
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.CORTEX_CERTIFICATES_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CORTEX_CERTIFICATES_P12_PASSWORD }}
          API_PRIVATE_KEY: ${{ secrets.CORTEX_APPSTORE_API_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.CORTEX_APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.CORTEX_APPSTORE_ISSUER_ID }}
        run: |
          python3 - <<'PYTHON'
          import base64
          import binascii
          import os
          import pathlib
          import plistlib
          import secrets
          import subprocess

          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          keychain = root / 'signing-check.keychain-db'
          certificate = root / 'signing-check.p12'
          report = []
          def note(message):
              print(message, flush=True)
              report.append('- ' + message)
          def run(args):
              return subprocess.run(args, capture_output=True, text=True)
          try:
              raw = os.environ.get('CERTIFICATE_BASE64', '')
              password = os.environ.get('CERTIFICATE_PASSWORD', '')
              if not raw:
                  raise RuntimeError('P12 secret is absent or empty')
              try:
                  payload = base64.b64decode(''.join(raw.split()), validate=True)
              except binascii.Error:
                  raise RuntimeError('P12 secret is not valid base64') from None
              certificate.write_bytes(payload)
              certificate.chmod(0o600)
              note('P12 base64 decoding: passed')
              parsed = run(['/usr/bin/openssl', 'asn1parse', '-inform', 'DER', '-in', str(certificate)])
              if parsed.returncode:
                  raise RuntimeError('Decoded data is not valid DER; check uploaded P12 encoding')
              note('Decoded DER structure: passed')
              kc_password = secrets.token_hex(24)
              for args in [
                  ['security', 'create-keychain', '-p', kc_password, str(keychain)],
                  ['security', 'unlock-keychain', '-p', kc_password, str(keychain)],
              ]:
                  if run(args).returncode:
                      raise RuntimeError('Cannot prepare temporary keychain')
              candidates = [('configured password', password)]
              if password.strip() != password:
                  candidates.append(('configured password with outer whitespace removed', password.strip()))
              if password:
                  candidates.append(('empty password', ''))
              imported = False
              for label, candidate in candidates:
                  result = run(['security', 'import', str(certificate), '-P', candidate,
                                '-k', str(keychain), '-T', '/usr/bin/codesign'])
                  if result.returncode == 0:
                      note('P12 import succeeded using ' + label)
                      imported = True
                      break
                  if 'MAC verification failed' in result.stderr:
                      note('P12 import using ' + label + ': MAC verification failed')
                  else:
                      note('P12 import using ' + label + ': failed (exit ' + str(result.returncode) + ')')
              if not imported:
                  raise RuntimeError('P12 cannot be imported with configured or empty password; certificate type remains unknown')
              identities = run(['security', 'find-identity', '-v', '-p', 'codesigning', str(keychain)])
              if identities.returncode:
                  raise RuntimeError('Cannot inspect signing identities')
              # Certificate identity names are public metadata; no key material is printed.
              note(identities.stdout.strip())
              available = 'Developer ID Application:' in identities.stdout
              note('Valid Developer ID Application identity with private key: ' + ('available' if available else 'not found'))
              for name in ['API_PRIVATE_KEY', 'API_KEY_ID', 'API_ISSUER_ID']:
                  note(name + ': ' + ('present' if os.environ.get(name) else 'missing'))
          except RuntimeError as error:
              note(str(error))
              raise SystemExit(1)
          finally:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('## Existing Apple signing credentials\n' + '\n'.join(report) + '\n')
              run(['security', 'delete-keychain', str(keychain)])
              certificate.unlink(missing_ok=True)
          PYTHON
